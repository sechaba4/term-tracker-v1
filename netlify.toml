[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Front door: serve the Term Tracker landing at the root URL
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# tt-core.js reads config at runtime — never cache it stale
[[headers]]
  for = "/tt-core.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
